name: Gokin
description: 'Gokin Solar Co., Ltd. (高景太阳能股份有限公司) is a Chinese photovoltaic manufacturer
  founded in 2019 and headquartered in Jiangsu, China. The company produces monocrystalline
  silicon ingots and wafers (N-type and P-type) and high-efficiency solar modules (GOKIN
  BC and FLAMINGO series), operating four major production bases with roughly 100 GW of
  wafer and 16 GW of module annual capacity. Ranked among the top three global silicon-wafer
  shippers, Gokin employs 6,000+ people, holds 500+ patents, and serves utility, commercial,
  and residential solar projects across 30+ countries. Backed by IDG Capital, Gokin is a
  solar-hardware manufacturer with a corporate marketing website and no public developer
  or API surface.'
